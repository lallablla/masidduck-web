<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 마시떡</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Container -->
    <div id="nav-container"></div>

    <!-- Admin Login Section -->
    <section class="admin-login">
        <div class="container">
            <div class="login-wrapper">
                <div class="login-header">
                    <h1><i class="fas fa-lock"></i> 관리자 로그인</h1>
                    <p>공지사항과 이벤트를 관리할 수 있습니다</p>
                </div>
                
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> 이메일
                        </label>
                        <input type="email" id="email" name="email" value="admin@masidduck.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-key"></i> 비밀번호
                        </label>
                        <input type="password" id="password" name="password" value="dltn2120!!" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> 로그인
                    </button>
                </form>
                
                <div class="login-footer">
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-home"></i> 홈으로 돌아가기
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="nav.js"></script>
    <script>
        // 간단한 로그인 처리
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                console.log('로그인 시도:', email); // 디버깅용
                
                try {
                    const response = await fetch('/api/auth.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    console.log('응답 상태:', response.status); // 디버깅용
                    
                    const data = await response.json();
                    console.log('응답 데이터:', data); // 디버깅용
                    
                    if (data.success) {
                        alert('로그인 성공! 관리자 대시보드로 이동합니다.');
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        alert('로그인 실패: ' + (data.error || '알 수 없는 오류'));
                    }
                } catch (error) {
                    console.error('로그인 오류:', error);
                    alert('로그인 중 오류가 발생했습니다: ' + error.message);
                }
            });
        });
    </script>
</body>
</html>
